name: ReleaseApkBuild
on:
  workflow_dispatch:
  push:
    branches: [master, refactoring]
    paths:
      - app/src/**
      - app/proguard-rules.pro
      - app/build.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  BuildReleaseApk:
    runs-on: ubuntu-latest
    env:
      CI_VERSION_CODE_OFFSET: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Retrieve Version
        run: |
          echo "VERSION_NAME=$(./gradlew -q app:printVersion)" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> "$GITHUB_OUTPUT"
        id: android_version
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - uses: actions/upload-artifact@v4
        with:
          name: LightNovelReader-${{steps.android_version.outputs.VERSION_NAME}}-${{steps.android_version.outputs.VERSION_CODE}}-release
          path: |
            ${{steps.sign_app.outputs.signedReleaseFile}}
            app/build/outputs/mapping/release/mapping.txt
