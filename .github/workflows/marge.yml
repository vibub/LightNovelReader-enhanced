name: ReleaseApkBuild
on:
  workflow_dispatch:
  push:
    branches: [ master, refactoring, dev/**, release/** ]
    paths:
      - app/src/**
      - app/proguard-rules.pro
      - app/build.gradle.kts
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts

jobs:
  BuildReleaseApk:
    runs-on: ubuntu-24.04
    env:
      BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Retrieve Version
        run: |
          echo "VERSION_NAME=$(./gradlew -q app:printVersion)" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$(./gradlew -q app:printVersionCode)" >> "$GITHUB_OUTPUT"
        id: android_version
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Prepare APK signing tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [[ ! -x "$build_tools/zipalign" || ! -x "$build_tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS_VERSION"
          fi
          for tool in zipalign apksigner; do
            if [[ ! -x "$build_tools/$tool" ]]; then
              echo "::error::未找到可执行的 APK 签名工具：$build_tools/$tool"
              exit 1
            fi
          done
      - name: Sign app APK
        id: sign_app
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/release-keystore.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"

          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          signed_dir="app/build/outputs/apk/release"
          mkdir -p "$signed_dir"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::未找到待签名的 release APK"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            apk_name="$(basename "${apk%.apk}")"
            aligned_apk="$signed_dir/$apk_name-aligned.apk"
            signed_apk="$signed_dir/$apk_name-signed.apk"
            "$build_tools/zipalign" -P 16 -f 4 "$apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$SIGNING_ALIAS" \
              --ks-pass env:KEY_STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$signed_apk" \
              "$aligned_apk"
            "$build_tools/apksigner" verify --verbose "$signed_apk"
            rm -f "$aligned_apk"
          done
          echo "signedReleaseDirectory=$signed_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: LightNovelReader-${{steps.android_version.outputs.VERSION_NAME}}-${{steps.android_version.outputs.VERSION_CODE}}-release
          path: |
            ${{steps.sign_app.outputs.signedReleaseDirectory}}/*-signed.apk
            app/build/outputs/mapping/release/mapping.txt
