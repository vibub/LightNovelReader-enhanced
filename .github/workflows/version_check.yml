name: VersionCheck
on:
  merge_group:
  pull_request:
    branches: [ master, refactoring, dev/**, release/** ]
    paths:
      - app/src/main/kotlin/**
      - build.gradle.kts
      - gradle.properties
      - settings.gradle

jobs:
  check-version:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Get version from PR
        id: get-pr-version
        run: |
          chmod +x ./gradlew
          echo "VERSION_NAME=$(./gradlew -q app:printVersionCode)" >> "$GITHUB_OUTPUT"
      - name: Get current version from PR base branch
        id: get-current-version
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git checkout --detach FETCH_HEAD
          chmod +x ./gradlew
          echo "VERSION_NAME=$(./gradlew -q app:printVersionCode)" >> "$GITHUB_OUTPUT"
      - name: Compare versions
        id: compare-versions
        run: |
          if [ ${{steps.get-pr-version.outputs.VERSION_NAME}} -le ${{steps.get-current-version.outputs.VERSION_NAME}} ]
          then
            echo "The version in the PR ${{steps.get-pr-version.outputs.VERSION_NAME}} is not higher than the current version ${{steps.get-current-version.outputs.VERSION_NAME}}."
            echo "Please increase the debug version number."
            exit 1
          fi
